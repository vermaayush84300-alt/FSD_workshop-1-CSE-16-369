<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }

        img {
            width: 500px;
            height: 300px;
            border: 3px solid black;
            border-radius: 10px;
        }

        button {
            margin: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Image Slider</h1>

    <img id="slider" src="image1.png" alt="Slider Image">

    <br><br>

    <button onclick="previousImage()">Previous</button>
    <button onclick="nextImage()">Next</button>

    <script>
        let images = [
            "image1.png",
            "image2.png",
            "image3.png",
            "image4.png"
        ];

        let index = 0;

        function nextImage() {
            index++;

            if (index >= images.length) {
                index = 0;
            }

            document.getElementById("slider").src = images[index];
        }

        function previousImage() {
            index--;

            if (index < 0) {
                index = images.length - 1;
            }

            document.getElementById("slider").src = images[index];
        }
    </script>

</body>

</html>
