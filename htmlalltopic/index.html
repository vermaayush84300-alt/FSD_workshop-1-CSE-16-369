<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        h1 {
            font-size: 40px;
        }

        #status {
            font-size: 25px;
            margin-bottom: 20px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        td {
            width: 100px;
            height: 100px;
            border: 3px solid black;
            font-size: 60px;
            text-align: center;
            cursor: pointer;
            background: white;
        }

        td:hover {
            background: #ddd;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 18px;
        }
    </style>

</head>

<body>

    <h1>Tic Tac Toe</h1>

    <h2 id="status">Player X Turn</h2>

    <table>

        <tr>
            <td id="0" onclick="play(0)"></td>
            <td id="1" onclick="play(1)"></td>
            <td id="2" onclick="play(2)"></td>
        </tr>

        <tr>
            <td id="3" onclick="play(3)"></td>
            <td id="4" onclick="play(4)"></td>
            <td id="5" onclick="play(5)"></td>
        </tr>

        <tr>
            <td id="6" onclick="play(6)"></td>
            <td id="7" onclick="play(7)"></td>
            <td id="8" onclick="play(8)"></td>
        </tr>

    </table>

    <button onclick="restart()">Restart</button>

    <script>

        let board = ["", "", "", "", "", "", "", "", ""];

        let player = "X";

        let gameOver = false;

        function play(index) {

            if (gameOver == true) {
                return;
            }

            if (board[index] != "") {
                return;
            }

            board[index] = player;

            document.getElementById(index).innerHTML = player;

            if (checkWinner()) {
                document.getElementById("status").innerHTML = player + " Wins!";
                gameOver = true;
                return;
            }

            if (board.indexOf("") == -1) {
                document.getElementById("status").innerHTML = "Match Draw!";
                gameOver = true;
                return;
            }

            if (player == "X") {
                player = "O";
            }
            else {
                player = "X";
            }

            document.getElementById("status").innerHTML = "Player " + player + " Turn";

        }

        function checkWinner() {

            if (board[0] == board[1] && board[1] == board[2] && board[0] != "")
                return true;

            if (board[3] == board[4] && board[4] == board[5] && board[3] != "")
                return true;

            if (board[6] == board[7] && board[7] == board[8] && board[6] != "")
                return true;

            if (board[0] == board[3] && board[3] == board[6] && board[0] != "")
                return true;

            if (board[1] == board[4] && board[4] == board[7] && board[1] != "")
                return true;

            if (board[2] == board[5] && board[5] == board[8] && board[2] != "")
                return true;

            if (board[0] == board[4] && board[4] == board[8] && board[0] != "")
                return true;

            if (board[2] == board[4] && board[4] == board[6] && board[2] != "")
                return true;

            return false;

        }

        function restart() {

            board = ["", "", "", "", "", "", "", "", ""];

            player = "X";

            gameOver = false;

            document.getElementById("status").innerHTML = "Player X Turn";

            for (let i = 0; i < 9; i++) {
                document.getElementById(i).innerHTML = "";
            }

        }

    </script>

</body>

</html>
